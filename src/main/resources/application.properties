server.port=8087
spring.application.name=notification

spring.datasource.url=jdbc:h2:file:./data/notification;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.h2.console.enabled=true

# Freemarker used programmatically from DB strings (classpath defaults optional)
spring.freemarker.check-template-location=false

notification.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# SMTP — override with env vars; leave mail.enabled=false to log-only locally
notification.mail.enabled=${NOTIFICATION_MAIL_ENABLED:false}
notification.mail.from=${NOTIFICATION_MAIL_FROM:noreply@localhost}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000

management.endpoints.web.exposure.include=health,info
